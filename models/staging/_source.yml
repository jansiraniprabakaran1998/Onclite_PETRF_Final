version: 2

sources:
  - name: raw
    database: ONCLITE_PETRF
    schema: RAW
    description: >
      Bronze layer landing tables. Loaded by python/ingestion/loader.py via
      COPY INTO, or by Snowpipe (snowflake/009_pipes.sql). No transformation
      applied here beyond metadata columns (_file_name, _row_number, _loaded_at).
    loader: python + snowpipe

    freshness:
      warn_after: {count: 6, period: hour}
      error_after: {count: 24, period: hour}
    loaded_at_field: _loaded_at

    tables:
      - name: raw_survey
        description: One row per fielded survey instance, as exported by the fielding vendor.
        columns:
          - name: survey_id_src
            description: Vendor-assigned natural key for the survey.
            tests: [not_null]
          - name: survey_name
            tests: [not_null]
          - name: indication_code
          - name: wave_code
          - name: launch_date
          - name: close_date
          - name: fielding_vendor

      - name: raw_respondent
        description: HCP respondent panel export. May contain duplicate rows across files (same respondent, multiple surveys).
        columns:
          - name: respondent_id_src
            tests: [not_null]
          - name: survey_id_src
            tests: [not_null]
          - name: specialty
          - name: years_in_practice
          - name: region
          - name: country_code
          - name: panel_source
          - name: consent_flag

      - name: raw_question
        description: Question bank export, one row per survey question.
        columns:
          - name: question_id_src
            tests: [not_null]
          - name: survey_id_src
            tests: [not_null]
          - name: question_text
          - name: question_type
          - name: question_category
          - name: product_code_ref

      - name: raw_response
        description: Grain = one respondent's answer to one question. Highest-volume source table.
        freshness:
          warn_after: {count: 2, period: hour}
          error_after: {count: 12, period: hour}
        columns:
          - name: response_id_src
            tests: [not_null]
          - name: survey_id_src
            tests: [not_null]
          - name: respondent_id_src
            tests: [not_null]
          - name: question_id_src
            tests: [not_null]
          - name: response_value
          - name: response_score
          - name: response_timestamp

      - name: raw_product
        description: Product master export - pharma/device products under market research.
        columns:
          - name: product_code_src
            tests: [not_null]
          - name: product_name
            tests: [not_null]
          - name: manufacturer
          - name: molecule
          - name: therapeutic_class
          - name: launch_status

      - name: raw_indication
        description: Disease/indication master.
        columns:
          - name: indication_code_src
            tests: [not_null]
          - name: indication_name
            tests: [not_null]
          - name: therapeutic_area
          - name: icd10_code

      - name: raw_product_indication
        description: Many-to-many product-to-indication mapping export.
        columns:
          - name: product_code_src
            tests: [not_null]
          - name: indication_code_src
            tests: [not_null]
          - name: is_primary_indication
          - name: approval_date
